<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 产品经理作品集 · 十二学智慧校园</title>
<style>
  :root{
    --purple:#7C3AED;--purple-d:#5B21B6;--purple-soft:#EDE4FF;
    --blue:#2563EB;--blue-d:#1D4ED8;--blue-soft:#E0EBFF;
    --teal:#0D9488;--teal-soft:#CCFBF1;
    --amber:#D97706;--amber-soft:#FEF3C7;
    --rose:#E11D48;--rose-soft:#FFE4E6;
    --green:#059669;--green-soft:#D1FAE5;
    --gray:#6B7280;--gray-soft:#F3F4F6;
    --ink:#1F2430;--muted:#667085;--line:#E5E7EB;--bg:#F7F7FB;--card:#FFFFFF;
    --shadow:0 6px 24px rgba(124,58,237,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.65;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}

  /* Hero */
  .hero{background:linear-gradient(135deg,#7C3AED 0%,#5B21B6 45%,#2563EB 100%);color:#fff;padding:52px 0 46px;position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;right:-80px;top:-120px;width:340px;height:340px;border-radius:50%;
    background:rgba(255,255,255,.08)}
  .hero .wrap{position:relative;z-index:1}
  .kicker{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
    font-size:12px;font-weight:700;letter-spacing:1px;padding:5px 14px;border-radius:999px;margin-bottom:16px}
  .hero h1{font-size:34px;line-height:1.25;margin-bottom:10px;letter-spacing:-.5px}
  .hero .sub{font-size:16px;opacity:.92;max-width:760px}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
  .legend span{font-size:11px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
    padding:4px 10px;border-radius:999px}
  .hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
  .btn-demo{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--purple-d);
    font-size:14px;font-weight:800;padding:12px 22px;border-radius:12px;box-shadow:0 8px 22px rgba(0,0,0,.18);
    transition:transform .18s}
  .btn-demo:hover{transform:translateY(-2px)}
  .btn-demo .arrow{font-size:17px}
  .btn-ghost{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.55);
    color:#fff;font-size:14px;font-weight:600;padding:12px 20px;border-radius:12px}
  .btn-ghost:hover{background:rgba(255,255,255,.12)}

  /* Nav */
  nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  nav .wrap::-webkit-scrollbar{display:none}
  nav a{white-space:nowrap;font-size:13px;font-weight:600;color:var(--muted);padding:13px 14px;border-bottom:2px solid transparent}
  nav a:hover{color:var(--purple);border-bottom-color:var(--purple)}

  /* Sections */
  section{padding:38px 0 6px;scroll-margin-top:56px}
  .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .sec-no{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:var(--purple-soft);color:var(--purple);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .sec-head h2{font-size:21px;letter-spacing:-.3px}
  .sec-head .en{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    padding:20px 22px;margin-bottom:14px}
  .h3{font-size:15px;font-weight:800;color:var(--purple-d);margin:4px 0 10px;display:flex;align-items:center;gap:8px}
  .h3:before{content:"";width:4px;height:15px;border-radius:2px;background:var(--purple)}
  .p{font-size:14px;color:#374151;margin-bottom:8px;word-break:break-word}
  .p:last-child{margin-bottom:0}

  /* Evidence chips (auto from [xxx]) */
  .ev{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;vertical-align:middle;margin:0 1px}
  .ev-real{background:var(--green-soft);color:#047857}
  .ev-sim{background:var(--blue-soft);color:var(--blue-d)}
  .ev-est{background:var(--amber-soft);color:#B45309}
  .ev-hyp{background:var(--gray-soft);color:#4B5563}

  /* Table */
  .tbl-wrap{overflow-x:auto;margin:6px 0 4px;border:1px solid var(--line);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:var(--purple-soft);color:var(--purple-d);font-weight:700;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  tr:nth-child(even) td{background:#FBFAFE}

  /* Cards row */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:6px 0}
  .mini{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:13px 14px;background:#fff}
  .mini.purple{border-left-color:var(--purple)} .mini.teal{border-left-color:var(--teal)}
  .mini.amber{border-left-color:var(--amber)} .mini.rose{border-left-color:var(--rose)}
  .mini .tag{display:inline-block;font-size:10px;font-weight:700;color:var(--muted);background:var(--gray-soft);
    padding:2px 7px;border-radius:5px;margin-bottom:6px}
  .mini .t{font-weight:800;font-size:14px;margin-bottom:4px}
  .mini .b{font-size:12.5px;color:#4B5563}

  /* KV */
  .kv{display:grid;grid-template-columns:130px 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .kv .k,.kv .v{padding:9px 12px;font-size:13px;border-bottom:1px solid var(--line)}
  .kv .k{background:#FAFAFC;font-weight:700;color:var(--muted)}
  .kv .v{color:#374151}
  .kv .k:last-of-type,.kv .v:last-of-type{border-bottom:0}

  /* Callout */
  .callout{border-radius:10px;padding:12px 14px;font-size:13px;margin:6px 0;border-left:4px solid var(--blue);background:var(--blue-soft);color:var(--blue-d)}
  .callout.warn{border-left-color:var(--amber);background:var(--amber-soft);color:#92400E}

  /* Score strip */
  .score-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:8px 0}
  .score{border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:#fff}
  .score .q{font-size:12px;color:var(--muted);font-weight:700}
  .score .v{font-size:24px;font-weight:800;color:var(--purple);margin:2px 0}
  .score .v small{font-size:12px;color:var(--muted);font-weight:600}
  .score .g{font-size:11.5px;color:#4B5563}

  /* Details / PRD */
  details{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
  details summary{cursor:pointer;padding:11px 14px;font-weight:700;font-size:14px;color:var(--ink);list-style:none;
    display:flex;align-items:center;gap:9px}
  details summary::-webkit-details-marker{display:none}
  details summary:before{content:"+";color:var(--purple);font-weight:800;font-size:17px;width:16px}
  details[open] summary:before{content:"−"}
  details .dbody{padding:0 14px 14px 39px}

  /* ===== Map (scoped) ===== */
  .map{font-size:13px}
  .map .m-legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .map .m-legend span{font-size:11px;color:#374151;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:4px 10px;display:inline-flex;align-items:center;gap:6px}
  .map .m-legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .map .m-panel{background:#FAFAFC;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  .map .m-title{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:12px;letter-spacing:.3px}
  .map .m-flow{display:flex;align-items:stretch;overflow-x:auto}
  .map .m-zone{flex:1;min-width:130px;display:flex;flex-direction:column}
  .map .m-zh{color:#fff;text-align:center;font-size:12.5px;font-weight:700;padding:8px 4px;border-radius:8px 8px 0 0}
  .map .m-zb{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;
    padding:10px 8px;display:flex;flex-direction:column;gap:8px;flex:1}
  .map .m-node{background:#fff;border:1px solid var(--line);border-left-width:4px;border-radius:7px;
    padding:8px 9px;font-size:12px;white-space:pre-line}
  .map .m-chip{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-bottom:4px}
  .map .m-arrow{flex:0 0 22px;display:flex;align-items:center;justify-content:center}
  .map .m-arrow:before{content:"";width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:9px solid #9CA3AF}
  .map .zp{background:var(--purple)} .map .np{border-left-color:var(--purple)} .map .cp{background:var(--purple-soft);color:var(--purple)}
  .map .zb{background:var(--blue)} .map .nb{border-left-color:var(--blue)} .map .cb{background:var(--blue-soft);color:var(--blue)}
  .map .zt{background:var(--teal)} .map .nt{border-left-color:var(--teal)} .map .ct{background:var(--teal-soft);color:var(--teal)}
  .map .za{background:var(--amber)} .map .na{border-left-color:var(--amber)} .map .ca{background:var(--amber-soft);color:var(--amber)}
  .map .zr{background:var(--rose)}
  .map .m-fb{background:var(--rose-soft);border:1px dashed var(--rose);border-radius:11px;padding:13px}
  .map .m-fb-t{font-size:12px;font-weight:700;color:var(--rose);margin-bottom:10px}
  .map .m-fb-flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .map .m-fb-node{background:#fff;border:1px solid var(--rose);color:#9F1239;border-radius:7px;padding:6px 10px;font-size:12px}
  .map .m-back{margin-top:9px;font-size:11.5px;color:#9F1239;font-weight:700}
  .map .m-metrics{background:var(--blue-soft);border:1px dashed var(--blue);border-radius:11px;padding:13px}
  .map .m-grid{display:flex;flex-wrap:wrap;gap:8px}
  .map .m-item{background:#fff;border:1px solid var(--blue);border-radius:8px;padding:8px 10px;font-size:11.5px;flex:1 1 140px}
  .map .m-item .m-layer{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-bottom:4px}
  .map .le{background:#EDE4FF;color:var(--purple)} .map .lx{background:#CCFBF1;color:var(--teal)} .map .lb{background:#FEF3C7;color:var(--amber)}
  .map .m-item .m-n{font-weight:700;display:block} .map .m-item .m-p{color:var(--muted)}

  footer{text-align:center;color:var(--muted);font-size:12px;padding:34px 20px 40px}
  @media(max-width:820px){
    .hero{padding:38px 0 32px} .hero h1{font-size:26px}
    section{padding-top:30px} .sec-head h2{font-size:18px}
    .card{padding:16px} .kv{grid-template-columns:100px 1fr}
    .btn-demo,.btn-ghost{font-size:13px;padding:10px 16px}
    .map .m-flow{flex-direction:column}
    .map .m-arrow{height:20px;flex:0 0 20px}
    .map .m-arrow:before{border-left:6px solid transparent;border-right:6px solid transparent;
      border-top:9px solid #9CA3AF;border-bottom:0}
    .map .m-zb{flex-direction:row;flex-wrap:wrap} .map .m-node{flex:1 1 130px}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <span class="kicker" id="kicker">AI 产品经理作品集</span>
    <h1 id="title">项目名</h1>
    <p class="sub" id="subtitle">一句话说清项目</p>
    <div class="legend">
      <span>证据标注</span>
      <span>[真实] 有数据/日志</span><span>[仿真] 样例集跑分</span>
      <span>[估算] 行业基准推算</span><span>[假设] 待确认</span>
    </div>
    <div class="hero-cta">
      <a class="btn-demo" href="https://2013102249.github.io/shierxue-smart-campus-demo/" target="_blank" rel="noopener">
        <span>▶</span>打开可点击 Demo<span class="arrow">↗</span>
      </a>
      <a class="btn-ghost" href="#s5">查看评测方案 ↓</a>
    </div>
  </div>
</header>

<nav><div class="wrap" id="nav"></div></nav>

<main class="wrap">
  <section id="s1"><div class="sec-head"><div class="sec-no">1</div><div><h2>项目概览</h2><div class="en">Overview &amp; Assessment</div></div></div><div id="b1"></div></section>
  <section id="s2"><div class="sec-head"><div class="sec-no">2</div><div><h2>作品设计文档</h2><div class="en">Design Doc</div></div></div><div id="b2"></div></section>
  <section id="s3"><div class="sec-head"><div class="sec-no">3</div><div><h2>可审阅 PRD</h2><div class="en">PRD</div></div></div><div id="b3"></div></section>
  <section id="s4"><div class="sec-head"><div class="sec-no">4</div><div><h2>综合方案图</h2><div class="en">Solution Map</div></div></div><div class="card map" id="map"></div></section>
  <section id="s5"><div class="sec-head"><div class="sec-no">5</div><div><h2>评测方案</h2><div class="en">Evaluation</div></div></div><div id="b5"></div></section>
</main>

<footer>AI 产品经理作品集 · 单文件页面，可离线打开 · 证据分级：真实 / 仿真 / 估算 / 假设</footer>

<script>
const CONFIG = {
  kicker: "AI 产品经理作品集 · 教育科技方向",
  title: "十二学智慧校园 · AI 自习室",
  subtitle: "面向 K12 学校的课后学习与校园管理一体化平台，以 AI 自习室为切入点：学生拍照提问拿到分步思路、专注行为可量化反馈、家长每周看到结构化成长数据。[假设]",
  nav: [
    {id:"s1", label:"项目概览"}, {id:"s2", label:"设计文档"}, {id:"s3", label:"PRD"},
    {id:"s4", label:"方案图"}, {id:"s5", label:"评测方案"}
  ],

  /* ===== 01 项目概览：资产盘点 + 四问体检 + 补全路线 ===== */
  b1: [
    {type:"score", items:[
      {q:"Q1 问题定义", score:"1/2", gap:"三类断层+四类画像已在，但痛点缺可观察的失败现象与归因证据"},
      {q:"Q2 指标体系", score:"1/2", gap:"有 6 项业务目标，缺 AI 效果指标与口径定义、数据来源标注"},
      {q:"Q3 评测方案", score:"0/2", gap:"原 PRD 无评测集、通过线、回归机制——本次补全的核心"},
      {q:"Q4 bad case", score:"0/2", gap:"风险表提到答疑准确率风险，但无分类分级与修复闭环"}
    ]},
    {type:"callout", tone:"warn", text:"原 PRD 由 AI 辅助生成，目标数字均为规划值而非实测结果。本作品集按证据分级重述：业务目标记 [假设]，Demo 模拟数据记 [仿真]，行业基准推算记 [估算]。未把任何规划值写成已达成结果。"},
    {type:"h", text:"现有资产盘点（来自 PRD V1.0 + 单文件交互 Demo）"},
    {type:"table", head:["资产项","状态","已有内容","本次处理"], rows:[
      ["问题定义","薄弱","三个断层描述 + 四类角色画像","保留，补可观察失败场景与归因，见板块 2"],
      ["方案与功能","已有","AI 自习室 7 子功能 + 智慧教学/校园管理/家校互通三模块","保留，明确 MVP 边界与不做什么"],
      ["可点击 Demo","已有","21 个功能页、4 角色切换、座位预约、AI 答疑、签到模拟等交互","作为验收载体，顶部可一键打开"],
      ["技术选型","缺失","仅有「大模型」「模型接口可插拔」等描述","补 RAG/工作流选型与否决理由，见板块 2/3"],
      ["指标体系","薄弱","签约≥10 校、MAU≥5 万等 6 项业务目标","补三层指标 + 口径 + 来源标注，见板块 2"],
      ["评测与 bad case","缺失","风险表提到答疑准确率与教师纠错通道","独立成章补完整方案，见板块 5"]
    ]},
    {type:"h", text:"补全路线图（按投入产出比排序）"},
    {type:"p", text:"1. 补齐 Q1 场景化痛点与 Q2 三层指标（成本最低、面试高频）→ 2. 建立 Q4 bad case 分类分级与修复闭环 → 3. 产出 Q3 完整评测方案（评测集 / 三档通过线 / 回归 / 迭代记录）。本次一次性完成三步，四个问题全部从 0–1 分补到可展示状态。"}
  ],

  /* ===== 02 作品设计文档 ===== */
  b2: [
    {type:"h", text:"背景与痛点"},
    {type:"p", text:"【学生与家长】在【放学后至晚自习前】要完成【作业与薄弱点巩固】，现在的做法是【在家自主写 + 家长凭经验辅导 / 微信群碎片消息了解情况】，会出现【卡题无人问、专注度不可见、家长只能问「写完了吗」】的失败现象，根因是【课后学习过程没有被结构化记录和反馈，答疑与学情数据割裂在不同的系统里】。[假设]：以上来自 PRD 的问题陈述推演，非真实用户访谈数据。"},
    {type:"p", text:"可观察证据（待验证）：自习室占座与迟到释放是校方现有管理中可计数的现象；家长端周打开率目标设为 ≥60% 本身反映校方对「信息不同步」的焦虑 [假设]。验证计划：P1 试点校上线前，对 30 名家长 + 2 名班主任做半结构化访谈，记录一周内「主动询问孩子学习情况」的次数与找不到答案的比例，作为痛点基线。"},
    {type:"h", text:"目标用户与场景"},
    {type:"table", head:["角色","类型","经验水平","使用频率","决策权","触发场景"], rows:[
      ["学生","主用户","K12 在校生，数字原生","每周 4–6 次自习","可决定预约与是否提问","卡题 / 想找一个安静座位 / 看今天专注分"],
      ["家长","主用户（付费方）","无学科辅导能力或没时间","每天看日报，每周看周报","决定会员付费","想知道孩子学到什么、想问老师但怕打扰"],
      ["教师","次用户","学科教师 / 班主任","每日查看，事件触发介入","决定采纳 AI 解析、发起复核","收到错题聚合 / 专注异常 / 家长咨询"],
      ["校管理方","次用户（采购方）","教务管理者","每日看板，周期性排课审批","决定采购与规则配置","开学排课 / 考勤汇总 / 课后服务出成绩"]
    ]},
    {type:"h", text:"方案与 MVP 边界"},
    {type:"p", text:"产品形态：Web 管理端 + 移动端 H5/小程序的学生与家长视图；复用公司已有「5G 高效课堂」的课程与账号体系 [假设]。核心功能主路径：① 学生预约选座 → ② 人脸签到 → ③ 拍照提问得到分步思路 → ④ 系统生成专注与错题报告 → ⑤ 家长端接收结构化反馈。MVP 边界（明确不做）：不做完整校园缴费与排课的算法替代（P2 再做）、不采集人脸原图上云（仅校端存特征向量）、AI 答疑 P1 只覆盖语数英主科、不做主观题自动判分。"},
    {type:"h", text:"技术选型（RAG / Agent / 工作流 / MCP 四选，含否决理由）"},
    {type:"cards", color:"purple", items:[

    {type:"details", title:"1. 模型选型与理由", open:true, blocks:[
      {type:"p", text:"AI 答疑：通用多模态大模型 + RAG（教材知识点库 / 校内题库）+ 结构化输出约束。理由：题目含图片需多模态识别；解析必须可溯源、知识可独立更新；输出格式固定为「思路引导步骤 + 同类题」。否决纯微调与纯通用大模型直答：前者迭代慢且无出处，后者易幻觉且会直接给答案。"},
      {type:"p", text:"专注度监测：专用视觉行为分类 + 规则阈值（连续离座 >5min 提醒、交谈 >30s 记录），不采用通用大模型逐帧判断。理由：行为类别固定、要求低延迟与可解释，专用模型 + 规则更稳更便宜。模型接口按 PRD 要求保持可插拔 [假设]。"}

    {type:"details", title:"2. Prompt / 知识库策略", blocks:[

      {type:"p", text:"知识库策略：来源为教材知识点切片 + 校内题库（占位符：{{TEXTBOOK_INDEX}} / {{SCHOOL_QUESTION_BANK}}），按学科/章节/难度标签建索引；更新机制=教研老师每月审校一次、新增题当日入库；时效性要求=考试周前完成对应章节校准 [假设]。不写任何密钥或内部数据。"}
    ]},
    {type:"details", title:"3. 评测指标与失败兜底", blocks:[

      {type:"p", text:"失败兜底分类：识别失败→重试一次并提示重拍；检索无命中→降级为通用思路引导并标记待复核；低置信度解析→转教师复核队列，不直接展示；输出格式违规→后端校验拦截并重新生成；服务超时→兜底文案「已收到，老师稍后回复」并生成工单。完整分类与迭代记录见板块 5。"}
    ]},
    {type:"details", title:"4. 人工确认节点", blocks:[
      {type:"p", text:"节点一：答疑置信度低于阈值或检索无命中 → 进入教师复核队列，教师有采纳/改写/驳回的决策权，超时 30 分钟自动降级为兜底文案并通知。节点二：专注异常事件（离座 >5min / 交谈 >30s）→ 系统只推送值班管理员确认，不直接判定学生违纪。节点三：人脸采集知情同意 → 校方与家长书面确认后方可启用。"},
      {type:"p", text:"复核不通过回流路径：教师驳回的解析进入 bad case 库，作为评测集补充样本；改写后的正确解析回流题库，形成数据飞轮。"}
    ]},
    {type:"details", title:"5. 成本与延迟", blocks:[
      {type:"p", text:"成本量级 [估算]：单次答疑（多模态识别 + 检索 + 生成）约 ¥0.05–0.15，按每日 3,251 次 [仿真，Demo 展示值] 估算日成本约 ¥163–488；专注度监测走专用模型，单座位日成本约 ¥0.02–0.05。延迟量级 [假设]：首字 <1s、端到端 <3s、人脸比对 <1s（对应 PRD 非功能需求）。"},

/* ===== 渲染逻辑 ===== */
const evMap = {"[真实]":"ev-real","[仿真]":"ev-sim","[估算]":"ev-est","[假设]":"ev-hyp"};
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function fmt(text){
  let s = esc(text);
  s = s.replace(/\[(真实|仿真|估算|假设)\]/g, m => '<span class="ev '+evMap[m]+'">'+m+'</span>');
  return s.replace(/\n/g,"<br>");
}
function renderBlocks(blocks){
  return blocks.map(b => {
    switch(b.type){
      case "h": return '<div class="h3">'+fmt(b.text)+'</div>';
      case "p": return '<p class="p">'+fmt(b.text)+'</p>';
      case "table":
        return '<div class="tbl-wrap"><table><thead><tr>'+b.head.map(h=>'<th>'+fmt(h)+'</th>').join("")+
          '</tr></thead><tbody>'+b.rows.map(r=>'<tr>'+r.map(c=>'<td>'+fmt(c)+'</td>').join("")+'</tr>').join("")+
          '</tbody></table></div>';
      case "cards":
        return '<div class="cards">'+b.items.map(it=>
          '<div class="mini '+(b.color||"blue")+'">'+(it.tag?'<span class="tag">'+fmt(it.tag)+'</span>':"")+
          '<div class="t">'+fmt(it.title)+'</div><div class="b">'+fmt(it.body)+'</div></div>').join("")+'</div>';
      case "kv":
        return '<div class="kv">'+b.items.map(it=>'<div class="k">'+fmt(it.k)+'</div><div class="v">'+fmt(it.v)+'</div>').join("")+'</div>';
      case "callout":
        return '<div class="callout '+(b.tone==="warn"?"warn":"")+'">'+fmt(b.text)+'</div>';
      case "score":
        return '<div class="score-strip">'+b.items.map(it=>
          '<div class="score"><div class="q">'+fmt(it.q)+'</div><div class="v">'+fmt(it.score)+'</div>'+
          '<div class="g">'+fmt(it.gap)+'</div></div>').join("")+'</div>';
      case "details":
        return '<details '+(b.open?"open":"")+'><summary>'+fmt(b.title)+'</summary><div class="dbody">'+
          renderBlocks(b.blocks||[])+'</div></details>';
      default: return "";
    }
  }).join("");
}
document.getElementById("kicker").textContent = CONFIG.kicker;
document.getElementById("title").textContent = CONFIG.title;
document.getElementById("subtitle").textContent = CONFIG.subtitle;
document.getElementById("nav").innerHTML = CONFIG.nav.map(n=>'<a href="#'+n.id+'">'+esc(n.label)+'</a>').join("");
document.getElementById("b1").innerHTML = renderBlocks(CONFIG.b1);
document.getElementById("b2").innerHTML = renderBlocks(CONFIG.b2);
document.getElementById("b3").innerHTML = renderBlocks(CONFIG.b3);
document.getElementById("b5").innerHTML = renderBlocks(CONFIG.b5);

(function(){
  const m = CONFIG.map;
  const zoneColor = p => ({purple:"zp",blue:"zb",teal:"zt",amber:"za"}[p]||"zb");
  const nodeColor = p => ({purple:"np",blue:"nb",teal:"nt",amber:"na"}[p]||"nb");
  const chipColor = p => ({purple:"cp",blue:"cb",teal:"ct",amber:"ca"}[p]||"cb");
  const arrow = '<div class="m-arrow"></div>';
  const el = document.getElementById("map");
  el.innerHTML =
    '<div class="m-legend">'+m.zones.map(z=>'<span><i class="'+zoneColor(z.color)+'"></i>'+esc(z.name)+'</span>').join("")+
      '<span><i class="zr"></i>异常兜底</span><span><i class="zb"></i>指标埋点</span></div>'+
    '<div class="m-panel"><div class="m-title">主流程（用户侧 → 业务流程 → AI 组件 → 人工确认）</div><div class="m-flow">'+
      m.zones.map((z,i)=>(i?arrow:"")+'<div class="m-zone"><div class="m-zh '+zoneColor(z.color)+'">'+esc(z.name)+'</div>'+
        '<div class="m-zb">'+z.nodes.map(n=>(n.chip?'<span class="m-chip '+chipColor(z.color)+'">'+esc(n.chip)+'</span><br>':"")+
          '<div class="m-node '+nodeColor(z.color)+'">'+fmt(n.label)+'</div>').join("")+'</div></div>').join("")+
      '</div></div>'+
    '<div class="m-panel"><div class="m-title">异常兜底（最终回到结果输出）</div><div class="m-fb">'+
      '<div class="m-fb-t">'+fmt(m.fallback.trigger)+'</div><div class="m-fb-flow">'+
      m.fallback.nodes.map((n,i)=>(i?arrow:"")+'<div class="m-fb-node">'+esc(n)+'</div>').join("")+'</div>'+
      '<div class="m-back">↩ 兜底后回到：'+esc(m.fallback.backTo)+'</div></div></div>'+
    '<div class="m-panel"><div class="m-title">指标埋点（效果 / 体验 / 业务，与板块 2、5 一一对应）</div>'+
      '<div class="m-metrics"><div class="m-grid">'+m.metrics.map(x=>{
        const lc={effect:"le",exp:"lx",biz:"lb"}[x.layer]||"lb";
        const ll={effect:"效果",exp:"体验",biz:"业务"}[x.layer]||"指标";
        return '<div class="m-item"><span class="m-layer '+lc+'">'+ll+'</span><span class="m-n">'+esc(x.name)+'</span>'+
          '<span class="m-p">'+esc(x.point)+'</span></div>';
      }).join("")+'</div></div></div>';
})();
</script>
